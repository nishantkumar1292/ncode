<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ncode</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="threads">
      <div id="welcome" class="welcome">
        <div class="welcome-mark">✻</div>
        <h1>What are we building today?</h1>
        <p>Add a project folder to start, or pick one from the sidebar.</p>
        <button id="welcome-add" class="btn primary welcome-btn">Add project <kbd>⌘O</kbd></button>
      </div>
      <button id="jump" class="jump" hidden title="Jump to latest">↓</button>
    </div>
    <div id="bottom">
      <div id="dock"></div>
      <div id="headsup" class="heads-up" role="status" hidden></div>
      <div id="composer" class="composer" hidden>
        <div id="atts" class="atts"></div>
        <div class="input-wrap">
          <div id="shell-badge" class="shell-badge" hidden>!</div>
          <textarea id="input" rows="1" spellcheck="true" placeholder="Reply to Claude…"></textarea>
        </div>
        <div class="composer-row">
          <button id="attach" class="icon-btn" title="Attach files or images">
            <svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button id="mode" class="chip" title="Permission mode (⇧Tab to cycle)"></button>
          <div class="spacer"></div>
          <button id="ring" class="ring is-off" aria-label="Session status"></button>
          <button id="model" class="chip ghost" title="Model and effort"></button>
          <button id="send" class="send" title="Send (↩)">
            <svg class="i-send" viewBox="0 0 20 20" width="16" height="16"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <svg class="i-stop" viewBox="0 0 20 20" width="14" height="14"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="popover" class="popover" hidden></div>
        <div id="glance" class="glance" role="dialog" aria-label="Session details" hidden></div>
      </div>
    </div>
  </main>
  <aside id="activity" class="activity" hidden>
    <div class="activity-head">
      <span>Activity</span>
      <button id="activity-close" class="icon-btn" title="Close (⌘J)">✕</button>
    </div>
    <div id="activity-body" class="activity-body"></div>
  </aside>
</div>
<div id="menu" class="menu" hidden></div>
<div id="finder" class="finder" hidden>
  <div class="finder-card" role="dialog" aria-label="Add project">
    <div class="finder-search">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12.8 12.8 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="finder-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search projects, or type a path like ~/dev" role="combobox" aria-controls="finder-list" aria-expanded="true" aria-autocomplete="list">
    </div>
    <div id="finder-list" class="finder-list" role="listbox"></div>
    <div class="finder-foot"><span><kbd>↩</kbd> add</span><span><kbd>⇥</kbd> complete path</span><span><kbd>⌘↩</kbd> add another</span><span class="spacer"></span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
